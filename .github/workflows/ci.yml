name: CI

env:
  OSS_CAD_SUITE: '2026-07-24'
  SV2V: 'v0.0.13'

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testbenches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.OSS_CAD_SUITE }}
      - name: alu
        run: make MOD=alu
      - name: regfile
        run: make MOD=regfile

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.OSS_CAD_SUITE }}
      - name: Install sv2v
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://github.com/zachjs/sv2v/releases/download/$SV2V/sv2v-Linux.zip -o sv2v.zip
          unzip -j sv2v.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: alu formal
        run: make formal MOD=alu
